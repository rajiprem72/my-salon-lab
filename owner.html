<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>My Salon Lab - Owner</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .subtitle {
      color: #777;
      margin-top: 5px;
    }

    .refresh {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #333;
      color: white;
      font-size: 17px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .customer {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin: 12px 0;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .current {
      border: 3px solid #198754;
    }

    .position {
      font-size: 48px;
      font-weight: bold;
    }

    .name {
      font-size: 23px;
      font-weight: bold;
      margin-top: 5px;
    }

    .mobile {
      color: #777;
      margin-top: 5px;
    }

    .status {
      margin-top: 12px;
      font-weight: bold;
    }

    .job-done {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: #198754;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .job-done:disabled {
      opacity: 0.5;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border-radius: 18px;
      color: #777;
    }

    .queue-count {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- =================================================
       HEADER
  ================================================== -->

  <div class="header">

    <div class="logo">
      ✂️ My Salon Lab
    </div>

    <div class="subtitle">
      Owner Queue Dashboard
    </div>

  </div>


  <!-- =================================================
       REFRESH
  ================================================== -->

  <button
    class="refresh"
    onclick="loadQueue()">

    🔄 Refresh Queue

  </button>


  <div
    id="queueCount"
    class="queue-count">

  </div>


  <div
    id="queue">

    <div class="loading">
      Loading queue...
    </div>

  </div>


</div>


<script>


// =======================================================
// LOAD QUEUE
// =======================================================

function loadQueue() {


  google.script.run

    .withSuccessHandler(
      renderQueue
    )

    .withFailureHandler(
      function(error) {

        document
          .getElementById("queue")
          .innerHTML =
          "<div class='empty'>" +
          "Unable to load queue." +
          "</div>";

        console.log(error);

      }
    )

    .getQueue();

}


// =======================================================
// RENDER QUEUE
// =======================================================

function renderQueue(customers) {


  const container =
    document.getElementById("queue");


  const count =
    document.getElementById("queueCount");


  container.innerHTML = "";


  if (
    !customers ||
    customers.length === 0
  ) {

    count.innerText =
      "No customers waiting";

    container.innerHTML =
      "<div class='empty'>" +
      "The queue is currently empty." +
      "</div>";

    return;

  }


  count.innerText =
    customers.length +
    " customer" +
    (
      customers.length === 1
      ? ""
      : "s"
    ) +
    " in the queue";


  customers.forEach(
    function(customer) {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "customer";


      if (
        customer.status ===
        "IN_SERVICE"
      ) {

        div.classList.add(
          "current"
        );

      }


      let html = "";


      html +=
        "<div class='position'>" +
        "#" +
        customer.position +
        "</div>";


      html +=
        "<div class='name'>" +
        escapeHtml(
          customer.name
        ) +
        "</div>";


      html +=
        "<div class='mobile'>" +
        escapeHtml(
          customer.mobile
        ) +
        "</div>";


      html +=
        "<div class='status'>" +
        (
          customer.status ===
          "IN_SERVICE"
          ? "✂️ IN SERVICE"
          : "⏳ WAITING"
        ) +
        "</div>";


      // -------------------------------------------------
      // JOB DONE BUTTON
      // -------------------------------------------------

      if (
        customer.status ===
        "IN_SERVICE"
      ) {

        html +=
          "<button " +
          "class='job-done' " +
          "id='done-" +
          customer.id +
          "' " +
          "onclick=\"completeJob('" +
          customer.id +
          "')\">" +

          "✓ JOB DONE" +

          "</button>";

      }


      div.innerHTML =
        html;


      container.appendChild(
        div
      );


    }
  );

}


// =======================================================
// COMPLETE JOB
// =======================================================

function completeJob(id) {


  if (
    !confirm(
      "Confirm that this customer's haircut is completed?"
    )
  ) {

    return;

  }


  const button =
    document.getElementById(
      "done-" + id
    );


  if (button) {

    button.disabled = true;

    button.innerText =
      "Updating Queue...";

  }


  google.script.run

    .withSuccessHandler(
      function(result) {

        loadQueue();

      }
    )

    .withFailureHandler(
      function(error) {

        alert(
          error.message ||
          "Unable to update queue."
        );

        loadQueue();

      }
    )

    .completeJob(id);

}


// =======================================================
// SECURITY / HTML ESCAPE
// =======================================================

function escapeHtml(text) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


// =======================================================
// INITIAL LOAD
// =======================================================

loadQueue();


// =======================================================
// AUTO REFRESH OWNER SCREEN
// =======================================================

setInterval(
  loadQueue,
  5000
);


</script>


</body>

</html>
